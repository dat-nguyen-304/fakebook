# ============================================================================
#  Cấu hình tạo cluster kind CÓ HỖ TRỢ INGRESS. Cluster cũ tạo bằng lệnh trần
#  nên thiếu 2 thứ dưới -> Ingress không vào được từ máy Mac. Đây là lý do phải
#  dựng lại (Phương án A).
#
#  Tạo bằng: kind create cluster --config k8s-playground/kind-config.yaml
# ============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fakebook
nodes:
  - role: control-plane

    # (1) Dán nhãn 'ingress-ready=true' lên node. Manifest ingress-nginx bản
    #     'kind' dùng nodeSelector này để biết ĐƯỢC PHÉP chạy controller ở đây.
    #     Không có nhãn -> pod controller kẹt Pending mãi.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

    # (2) "Khoan cổng" từ máy Mac -> vào trong node (Docker container). Controller
    #     ingress-nginx nghe hostPort 80/443 NGAY TRÊN node. Mapping này nối:
    #        Mac:3005  ->  node:80   (HTTP)   -> ingress-nginx -> các Service
    #        Mac:3443  ->  node:443  (HTTPS)
    #     Chọn 3005 (không phải 80) để trùng origin CORS cũ 'localhost:3005'
    #     -> khỏi rebuild api-gateway/ws-service. Cluster cũ chỉ map 6443 (API
    #     server) nên browser không tài nào chạm tới ingress được.
    extraPortMappings:
      - containerPort: 80
        hostPort: 3005
        protocol: TCP
      - containerPort: 443
        hostPort: 3443
        protocol: TCP
